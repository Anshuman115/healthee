# /etc/nginx/sites-available/healtheeapi.afk.codes
#
# Reverse-proxies https://healtheeapi.afk.codes -> 127.0.0.1:8765 (api container).
#
# TLS: this file is the plain :80 vhost. Run certbot AFTER enabling it:
#   sudo ln -s /etc/nginx/sites-available/healtheeapi.afk.codes \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d healtheeapi.afk.codes
# certbot rewrites this file in place, adding the :443 listener + cert paths and
# an http->https redirect. Renewal is automatic via certbot's systemd timer.

server {
    listen 80;
    listen [::]:80;
    server_name healtheeapi.afk.codes;

    # Cloudflare real-IP — restore the client IP when behind the orange cloud.
    # Safe to leave even if DNS-only. Refresh ranges from
    # https://www.cloudflare.com/ips/ periodically.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    # Multipart uploads (Gadgetbridge .db) can be large once history builds up.
    client_max_body_size 600M;

    # Long-running ingests can take 30s+ on big payloads.
    proxy_read_timeout  180s;
    proxy_send_timeout  180s;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Liveness shortcut — no auth, for uptime monitors and deploy.sh.
    location = /healthz {
        proxy_pass http://127.0.0.1:8765/healthz;
        access_log off;
    }
}
