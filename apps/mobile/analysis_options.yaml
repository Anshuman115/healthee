# Healthee mobile — analyzer configuration.
#
# CI runs `flutter analyze --fatal-warnings --fatal-infos`, so everything below
# is a build gate: an info-level lint fails the build exactly like an error.
# That is deliberate. A warning nobody has to fix is a warning nobody fixes.

include: package:flutter_lints/flutter.yaml

# ── riverpod_lint is NOT wired, and this says so rather than implying it is ──
#
# The brief asked for riverpod_lint under custom_lint. That combination no longer
# resolves: riverpod_lint 3.1.4 moved off custom_lint onto the analyzer's own
# plugin protocol, so 3.1.8 needs analyzer_plugin ^0.14.0 while custom_lint 0.8.1
# needs ^0.13.0 (pubspec.yaml has the detail).
#
# The successor path — a `plugins: {riverpod_lint: ^3.1.4}` block here — was tried
# and MEASURED, not assumed. On Flutter 3.44.7 it does not work:
#
#   * `flutter analyze` accepts the key and reports nothing from the plugin.
#     Verified by deleting the root `ProviderScope` from main.dart, which is a
#     textbook `missing_provider_scope` violation: analyze reported only the two
#     now-unused imports.
#   * `dart analyze`, which is supposed to run these plugins, HUNG — killed at
#     7+ minutes. Removing the block returns it to seconds.
#
# So the block is gone. A config that declares a lint nobody runs is worse than
# no config: it tells the next reader those rules are enforced, and they stop
# looking. The rules below are the ones that actually run.
#
# To enable it later: raise the Flutter SDK past the analyzer-12 ceiling (see
# pubspec.yaml), re-add the `plugins:` block, and RE-RUN THE MUTATION ABOVE —
# deleting the ProviderScope must fail analyze before the block is trusted.
analyzer:
  exclude:
    # Generated code is committed (see README §Generated code) but is not
    # hand-maintained; its generator owns its style. Everything else is ours.
    - "**/*.g.dart"
    - "**/*.drift.dart"

  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # ── The six Engineering Standards §3 names by ID. ──────────────────────
    - always_declare_return_types
    - prefer_final_locals
    - avoid_catches_without_on_clauses
    - unawaited_futures
    - directives_ordering
    - require_trailing_commas

    # ── Errors are never swallowed (Standards §1). ─────────────────────────
    # avoid_catches_without_on_clauses above bans a bare `catch (e)`; these
    # close the rest of the same hole.
    - avoid_catching_errors
    - only_throw_errors
    - use_rethrow_when_possible

    # ── Performance budgets (Standards §1: "const wherever possible"). ─────
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - avoid_unnecessary_containers

    # ── Typed boundaries. The data layer parses into models; feature code
    #    should never be handling `dynamic` at all (Standards §3). ──────────
    - avoid_dynamic_calls
    - avoid_type_to_string
    - cast_nullable_to_non_nullable
    - null_check_on_nullable_type_parameter
    - avoid_returning_null_for_void

    # ── Readability (Standards §1: full words, one responsibility). ────────
    - always_use_package_imports
    - avoid_positional_boolean_parameters
    - avoid_void_async
    - library_private_types_in_public_api
    - prefer_single_quotes
    - sort_constructors_first
    - unnecessary_parenthesis
    - use_super_parameters

    # ── Async correctness. ────────────────────────────────────────────────
    - use_build_context_synchronously
