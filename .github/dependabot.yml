version: 2
updates:
  # GitHub Actions used in CI.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci"

  # Server Python dependencies (uv-managed; pip ecosystem reads pyproject).
  - package-ecosystem: pip
    directory: "/apps/server"
    schedule:
      interval: monthly
    labels:
      - dependencies
      - server
    commit-message:
      prefix: "chore"
      include: scope
